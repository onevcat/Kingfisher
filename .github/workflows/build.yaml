name: build

defaults:
  run:
    shell: bash -eo pipefail {0}

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-integration:
    name: SwiftPM consumer integration
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build Swift package
        run: swift build
      - name: Verify SwiftPM app integration and privacy manifest
        run: bundle exec ruby Scripts/verify-spm-consumer.rb

  build-framework:
    name: build (Xcode ${{ matrix.xcode }}, ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26.0.1'
            runner: macos-26
            destination: 'platform=macOS'
            label: 'macOS'
            cache-key: xcode-26.0.1-macos
          - xcode: '26.0.1'
            runner: macos-26
            sdk: iphonesimulator
            label: 'iOS Simulator'
            cache-key: xcode-26.0.1-ios
          - xcode: '26.0.1'
            runner: macos-26
            sdk: appletvsimulator
            label: 'tvOS Simulator'
            cache-key: xcode-26.0.1-tvos
          - xcode: '26.0.1'
            runner: macos-26
            sdk: watchsimulator
            label: 'watchOS Simulator'
            cache-key: xcode-26.0.1-watchos

          - xcode: '26.5'
            runner: macos-26
            destination: 'platform=macOS'
            label: 'macOS'
            cache-key: xcode-26.5-macos
          - xcode: '26.5'
            runner: macos-26
            sdk: iphonesimulator
            label: 'iOS Simulator'
            cache-key: xcode-26.5-ios
          - xcode: '26.5'
            runner: macos-26
            sdk: appletvsimulator
            label: 'tvOS Simulator'
            cache-key: xcode-26.5-tvos
          - xcode: '26.5'
            runner: macos-26
            sdk: watchsimulator
            label: 'watchOS Simulator'
            cache-key: xcode-26.5-watchos

          - xcode: '27.0'
            runner: xcode-27
            destination: 'platform=macOS'
            label: 'macOS'
            cache-key: xcode-27.0-macos
          - xcode: '27.0'
            runner: xcode-27
            sdk: iphonesimulator
            label: 'iOS Simulator'
            cache-key: xcode-27.0-ios
          - xcode: '27.0'
            runner: xcode-27
            sdk: appletvsimulator
            label: 'tvOS Simulator'
            cache-key: xcode-27.0-tvos
          - xcode: '27.0'
            runner: xcode-27
            sdk: watchsimulator
            label: 'watchOS Simulator'
            cache-key: xcode-27.0-watchos

          - xcode: '27.1'
            runner: xcode-27
            destination: 'platform=macOS'
            label: 'macOS'
            cache-key: xcode-27.1-macos
          - xcode: '27.1'
            runner: xcode-27
            sdk: iphonesimulator
            label: 'iOS Simulator'
            cache-key: xcode-27.1-ios
          - xcode: '27.1'
            runner: xcode-27
            sdk: appletvsimulator
            label: 'tvOS Simulator'
            cache-key: xcode-27.1-tvos
          - xcode: '27.1'
            runner: xcode-27
            sdk: watchsimulator
            label: 'watchOS Simulator'
            cache-key: xcode-27.1-watchos
    steps:
      - uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build framework
        env:
          DESTINATION: ${{ matrix.destination }}
          SDK: ${{ matrix.sdk }}
          DERIVED_DATA_PATH: build/DerivedData/${{ matrix.cache-key }}
          XCODE_VERSION: ${{ matrix.xcode }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '60'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '4'
        run: bundle exec fastlane build_ci
